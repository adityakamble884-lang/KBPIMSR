services:
  # 1. Django REST Backend Web Service
  - type: web
    name: kbpimsr-ems-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: ./build.sh
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: CSRF_TRUSTED_ORIGINS
        value: ""
      - key: MYSQL_HOST
        value: ""
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DATABASE
        value: ""
      - key: MYSQL_USER
        value: ""
      - key: MYSQL_PASSWORD
        value: ""

  # 2. React + Vite Frontend Static Site
  - type: web
    name: kbpimsr-ems-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://kbpimsr-ems-api.onrender.com
